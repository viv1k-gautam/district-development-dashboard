databases:
  - name: ddad-postgres
    databaseName: ddad
    user: ddad
    plan: free

services:
  - type: web
    name: ddad-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ddad-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          name: ddad-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: ddad-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: ddad-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
